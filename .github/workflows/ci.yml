name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    name: ${{ matrix.os }} / ${{ matrix.build_type }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022]
        build_type: [Release]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DFLOWBOARD_USE_STUB_SDK=ON
        shell: bash

      - name: Build
        run: cmake --build build --config ${{ matrix.build_type }} --parallel
        shell: bash

      - name: Test
        run: ctest --test-dir build -C ${{ matrix.build_type }} --output-on-failure
        shell: bash

      - name: Node docs up to date
        if: runner.os == 'Linux'
        run: |
          ./build/src/flowboard --dump-nodes | python3 tools/gen_node_docs.py > /tmp/NODES.md
          if ! diff -u docs/NODES.md /tmp/NODES.md; then
            echo "::error::docs/NODES.md is stale. Regenerate with:"
            echo "  ./build/src/flowboard --dump-nodes | python3 tools/gen_node_docs.py > docs/NODES.md"
            exit 1
          fi
        shell: bash

      - name: Bench (non-blocking)
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            ./build/tests/${{ matrix.build_type }}/bench_pipeline.exe || true
          else
            ./build/tests/bench_pipeline || true
          fi
        shell: bash
